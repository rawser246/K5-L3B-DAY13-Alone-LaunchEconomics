# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Số tính bằng src/lab13.py (python lab13.py cp4).
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (statsmodels NormalIndPower cho 1.250)
#   b) Theo nhân viên, m = 75: DE = 1 + 74 x 0,02 = 2,48; n = 3.103 mỗi nhóm -> 42 người mỗi nhóm, tổng 84 > 40: không đủ người
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa c/ICC = 1.000 < 1.251: không đạt
#   d) 6 depot mỗi nhóm: tối đa 6/0,02 = 300
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m/(1+(m-1)0,02) >= 859 -> m >= 299 yêu cầu mỗi người (DE 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia theo nhân viên 20 + 20:
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; cấp quyền theo tài khoản, log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trong file này trước ngày bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận: chia theo nhân viên không đủ mẫu cho mức chênh 5 điểm (tối đa 1.000 < 1.251).
#   Chấp nhận mức chênh 6 điểm (mde 0,06, cần m >= 299 yêu cầu/người); nếu tác động thật chỉ 5 điểm thì power còn 0,64.
#   Giám đốc vận hành phải ký chấp nhận đánh đổi này.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại: 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang: 3,97%.
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên dùng: chênh với đối chứng >= 2 điểm HOẶC trần tuyệt đối 6%.
#
# Thời gian: mỗi nhân viên nhận ~30,7 yêu cầu/ngày trong phạm vi (81,8% x 45.000/40/30)
#   -> đạt m = 299 sau ~10 ngày ở bước 0.50, cộng 7 ngày theo dõi mở lại.
#   Lịch: 01/12 bước 0.10 · 08/12 bước 0.25 · 15/12 bước 0.50 (bắt đầu đo) · 28/12 ngừng nhận mẫu
#   · 04/01 hết cửa sổ mở lại 7 ngày · 05/01/2027 quyết định.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22x và 0,69x so với 12.000 đ, simulated), 12 depot; loại quoc_te (1,88x, thành công 27,3%) và doi_tac (0,85x, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 -> 10 -> 20 nhân viên dùng trợ lý; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận, xem chú thích
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot, không truy cập trợ lý"
    spillover_risk: "Trung bình: nhân viên trong cùng depot có thể chia sẻ câu trả lời; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, mde 0,06, luật dừng và ngày quyết định chốt trong file này trước ngày bắt đầu, bốc thăm bằng seed ghi trước"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng >= 2 điểm hoặc vượt 6%, hoặc có >= 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và Kỹ sư trưởng agent rà trace KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công (simulated, sau tuần 1 thay bằng phút đo thật) > 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được giữ hang_nang trong phạm vi"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo trên số được xem lại) > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và báo PM KHÔNG THÌ không được chuyển bước rollout"
  interim_looks:
    frequency: "Hằng ngày cho chỉ số an toàn và hoàn trùng; hằng tuần (thứ Hai) cho chi phí và tỉ lệ bỏ qua gợi ý"
    safety_only: "Chỉ xem chỉ số an toàn, chi phí, mức độ sử dụng để áp luật dừng; không xem chỉ số chính theo nhóm trước 04/01/2027 để tránh dừng sớm do may rủi"
    reviewer: "Kỹ sư trưởng agent lập bảng theo dõi; Giám đốc vận hành là người duy nhất có quyền dừng"
    data_source: "Event có trace_id trong chi_so.md: ticket_reopened, refund_ledger_write, agent_run_completed, staff_review_decision"
  start_date: "2026-12-01"
  sample_window: "15/12/2026 - 28/12/2026 ở bước 0.50 (~10 ngày đủ m = 299 yêu cầu/người), cộng 7 ngày theo dõi mở lại"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm như trước pilot"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated (890 phút, 1.780.000 đ)"
    - "phut_lam_lai_simulated (1.132 phút, 2.264.000 đ)"
    - "Chi phí mỗi việc thành công 4.472 đ; trong phạm vi 3.414 đ, 4.599 đ khi cộng cố định"
    - "Bảng độ nhạy B1-B4 (làm lại +51,8%, xem lại +40,7%, xem lại 100% = 11.743 đ = 0,98x)"
    - "Baseline 0,70 và ICC 0,02 do đề cho"

